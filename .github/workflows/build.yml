# Compila e roda o lint a cada envio para a main (e em pull requests).
# O APK de teste fica em Actions › (execução) › Artifacts.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Também valida o gradle-wrapper.jar contra os checksums oficiais
      - uses: gradle/actions/setup-gradle@v4

      - name: Lint e APK de teste
        run: ./gradlew lintDebug assembleDebug --no-daemon

      - name: Publicar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: pomotimer-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publicar relatório do lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
