# Publica uma versão: ao enviar uma tag vX.Y.Z, compila o APK de release assinado
# e cria a Release no GitHub com o APK e o checksum SHA-256.
#
# Secrets necessários (Settings › Secrets and variables › Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Versão a partir da tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [[ ! "$V" =~ ^([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::A tag precisa ser vX.Y.Z (Y e Z até 99), recebi $GITHUB_REF_NAME"; exit 1
          fi
          # 1.2.3 -> 10203: sempre cresce junto com a versão
          CODE=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Versão $V (versionCode $CODE)"

      - name: Restaurar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 não configurado"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK de release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Conferir assinatura e preparar arquivos
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error::APK assinado não foi gerado"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          FP=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
          OUT="pomotimer-$VERSION_NAME.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          {
            echo "APK assinado do PomoTimer $VERSION_NAME (versionCode $VERSION_CODE)."
            echo
            echo "**SHA-256 do APK:** \`$(cut -d' ' -f1 "$OUT.sha256")\`"
            echo
            echo "**Certificado de assinatura (SHA-256):** \`$FP\`"
            echo
            echo "Confira se o certificado bate com o publicado no README antes de instalar."
          } > notes.md

      - name: Criar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$OUT" "$OUT.sha256" \
            --title "PomoTimer $VERSION_NAME" --notes-file notes.md --verify-tag

      - name: Apagar chave do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
